# =============================================================================
# Configuracao de deploy — lida por shell/build-image-production.sh
# =============================================================================
# Sem segredos aqui: so onde publicar e em que porta. Este arquivo E versionado
# de proposito, para que a porta usada em cada servidor fique registrada e
# ninguem precise editar o script para trocar.
#
# A porta escolhida aqui e gravada como APP_HOST_PORT no .env.production que
# viaja no pacote, e e ela que o docker-compose abre no LOOPBACK do servidor.
# E tambem o endereco que o proxy reverso (Nginx/Apache) consulta — trocou
# aqui, troque no vhost.
#
# Para descobrir o que ja esta ocupado em cada servidor:
#   bash shell/build-image-production.sh   ->  opcao 3
# =============================================================================

