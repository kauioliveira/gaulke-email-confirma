# Este compose roda NO SERVIDOR, ao lado do .tar carregado pelo exec.sh.
# Por isso NAO tem `build:`: la nao existe codigo-fonte, so a imagem que o
# build-image-production.sh gerou e enviou.
services:
  app:
    image: gaulke-email-confirma:latest
    container_name: gaulke-email-confirma
    restart: unless-stopped

    # A porta do host vem do .env.production e depende do --env-file no
    # comando do compose: o `env_file:` abaixo alimenta o AMBIENTE DO
    # CONTEINER, nao a interpolacao de ${...} aqui.
    #
    # Sem valor o compose FALHA, de proposito. Antes havia um padrao (8551) que
    # abria silenciosamente uma porta diferente da que o proxy consulta — o
    # container subia saudavel e o site nao respondia, sem nada no log.
    #
    # BIND EM TODAS AS INTERFACES, e nao so no loopback.
    # O Nginx Proxy Manager roda em CONTAINER, em outra rede Docker. O
    # `127.0.0.1` do host nao existe para ele, e as redes bridge sao isoladas
    # entre si — nem por IP nem por nome ele chegava aqui. E o mesmo desenho dos
    # outros sistemas da casa (jornal, apuracao, contrato), que publicam em
    # 0.0.0.0 e sao consultados pelo NPM como 192.168.0.204:<porta>.
    #
    # A porta fica visivel na rede interna. Quem fecha isso e o firewall do
    # servidor, nao o bind — e o proprio app exige senha ou sessao do painel.
    ports:
      - '${APP_HOST_PORT:?defina APP_HOST_PORT no .env.production (o build-image-production.sh grava a partir de shell/deploy.conf)}:3000'

    env_file:
      - .env.production

    volumes:
      # PDFs dos lotes. Sem volume eles somem a cada deploy, e os links
      # ja enviados aos clientes passam a devolver "arquivo indisponivel".
      - arquivos:/app/storage/files

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/admin/sessao']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  arquivos:
    name: gaulke-email-confirma-arquivos
