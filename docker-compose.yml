# Este compose roda NO SERVIDOR, ao lado do .tar carregado pelo exec.sh.
# Por isso NAO tem `build:`: la nao existe codigo-fonte, so a imagem que o
# build-image-production.sh gerou e enviou.
services:
  app:
    image: gaulke-email-confirma:latest
    container_name: gaulke-email-confirma
    restart: unless-stopped

    # A porta do host vem do .env.production e depende do --env-file no
    # comando do compose: o `env_file:` abaixo alimenta o AMBIENTE DO
    # CONTEINER, nao a interpolacao de ${...} aqui.
    #
    # Sem valor o compose FALHA, de proposito. Antes havia um padrao (8551) que
    # abria silenciosamente uma porta diferente da que o proxy consulta — o
    # container subia saudavel e o site nao respondia, sem nada no log.
    #
    # BIND EM TODAS AS INTERFACES, e nao so no loopback.
    # O Nginx Proxy Manager roda em CONTAINER, em outra rede Docker. O
    # `127.0.0.1` do host nao existe para ele, e as redes bridge sao isoladas
    # entre si — nem por IP nem por nome ele chegava aqui. E o mesmo desenho dos
    # outros sistemas da casa (jornal, apuracao, contrato), que publicam em
    # 0.0.0.0 e sao consultados pelo NPM como 192.168.0.204:<porta>.
    #
    # A porta fica visivel na rede interna. Quem fecha isso e o firewall do
    # servidor, nao o bind — e o proprio app exige senha ou sessao do painel.
    ports:
      - '${APP_HOST_PORT:?defina APP_HOST_PORT no .env.production (o build-image-production.sh grava a partir de shell/deploy.conf)}:3000'

    env_file:
      - .env.production

    volumes:
      # Anexos dos lotes. Sem volume eles somem a cada deploy, e os links
      # ja enviados aos clientes passam a devolver "arquivo indisponivel".
      - arquivos:/app/storage/files
      # Imagens usadas no corpo do e-mail. Mesmo motivo, com um agravante: a
      # imagem e buscada pelo cliente de e-mail TODA VEZ que a mensagem e
      # aberta, inclusive meses depois. Sem volume, comunicados antigos passam
      # a exibir uma arte quebrada.
      #
      # Elas NAO ficam em public/brand justamente por isso: aquele diretorio e
      # assado na imagem e nao tem como persistir o que for enviado pela tela.
      - imagens:/app/storage/imagens
      # Documentos enviados pelos clientes nas solicitacoes (pastas por
      # cliente). E o arquivo da empresa: perder este volume e perder os
      # documentos societarios, de DP e de IRPF recebidos.
      - documentos:/app/storage/documentos

    environment:
      DOCUMENTOS_DIR: /app/storage/documentos
      # o app fala com o clamd pela rede interna do compose, pelo nome do servico
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'

    depends_on:
      clamav:
        # o app sobe mesmo com o antivirus ainda carregando as assinaturas: o
        # upload fica em quarentena e e verificado quando o clamd responder
        condition: service_started

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/admin/sessao']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # Antivirus dos arquivos que os clientes enviam. O clamd leva 1-3 min para
  # carregar as assinaturas no boot e usa ~1,5 GB de RAM; o freshclam dentro
  # da mesma imagem atualiza as assinaturas sozinho. Nenhuma porta publicada:
  # so o app, pela rede interna do compose, fala com ele.
  clamav:
    image: clamav/clamav:stable
    container_name: gaulke-email-confirma-clamav
    restart: unless-stopped
    volumes:
      - clamav:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  arquivos:
    name: gaulke-email-confirma-arquivos
  imagens:
    name: gaulke-email-confirma-imagens
  documentos:
    name: gaulke-email-confirma-documentos
  clamav:
    name: gaulke-email-confirma-clamav
